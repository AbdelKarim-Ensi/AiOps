name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/frontend/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests unitaires
        run: npm test -- --no-watch

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Calculer le nom d'image en minuscules
        id: vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LOWER}/aiops-frontend" >> "$GITHUB_OUTPUT"

      - name: Login à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:latest
            ${{ steps.vars.outputs.image_name }}:${{ github.sha }}

  update-gitops-manifest:
    needs: docker-build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Patch du tag d'image
        working-directory: infra/k8s/gitops/frontend
        run: kustomize edit set image ${{ needs.docker-build-push.outputs.image_name }}=${{ needs.docker-build-push.outputs.image_name }}:${{ github.sha }}

      - name: Commit et push sur main (avec retry en cas de conflit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/gitops/frontend/kustomization.yaml
          git commit -m "chore(gitops): update frontend image to ${{ github.sha }} [skip ci]" || echo "Rien à committer"

          for i in $(seq 1 10); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push réussi (tentative $i)"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "::error::Échec du push après 10 tentatives"
              exit 1
            fi
            echo "Push échoué, tentative $i/10, nouvelle tentative..."
            sleep $((RANDOM % 8 + 2))
          done