

name: Backend CI/CD


on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"

jobs:
 
  lint-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests unitaires
        run: npm run test

  
  docker-build-push:
    needs: lint-build-test
    runs-on: ubuntu-latest
    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Calculer le nom d'image en minuscules
        id: vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LOWER}/aiops-backend" >> "$GITHUB_OUTPUT"

      - name: Login à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:latest
            ${{ steps.vars.outputs.image_name }}:${{ github.sha }}

  deploy:
    needs: docker-build-push
    runs-on: self-hosted

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Appliquer les migrations Prisma
        working-directory: apps/backend
        run: |
          kubectl run prisma-migrate-${{ github.sha }} \
            --rm -i --restart=Never \
            --image=${{ needs.docker-build-push.outputs.image_name }}:${{ github.sha }} \
            --namespace=aiops \
            --env="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --command -- npx prisma migrate deploy

      - name: Redéployer sur le cluster kind
        run: |
          kubectl set image deployment/api api=${{ needs.docker-build-push.outputs.image_name }}:${{ github.sha }} -n aiops
          kubectl rollout status deployment/api -n aiops --timeout=600s
