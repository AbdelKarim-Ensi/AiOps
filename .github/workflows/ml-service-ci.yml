name: ML Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/ml-service/**"
      - ".github/workflows/ml-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ml-service/**"
      # AJOUT : Phase 14 - tester le workflow depuis une PR qui ne touche que .github/
      - ".github/workflows/ml-service-ci.yml"

jobs:

  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-service

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ml-service/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérification syntaxique (compile check)
        run: python -m py_compile app/main.py app/loki_client.py app/backend_client.py app/predict.py app/features/loki_adapter.py app/features/feature_engineering.py

  # AJOUT : Phase 14 - scan CVE de l'image, sur PR et sur push, sans rien publier
  image-scan:
    needs: lint-build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build local de l'image (sans push)
        uses: docker/build-push-action@v5
        with:
          context: apps/ml-service
          push: false
          load: true
          tags: aiops-ml-service:scan

      - name: Trivy - rapport complet (non bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aiops-ml-service:scan
          format: json
          output: trivy-ml-service-report.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Trivy - gate CRITICAL (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aiops-ml-service:scan
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Publier le rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-ml-service-report
          path: trivy-ml-service-report.json

  docker-build-push:
    # AJOUT : Phase 14 - ancienne ligne conservée, remplacée par la ligne suivante
    # needs: lint-build
    needs: [lint-build, image-scan]
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Calculer le nom d'image en minuscules
        id: vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LOWER}/aiops-ml-service" >> "$GITHUB_OUTPUT"

      - name: Login à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: apps/ml-service
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:latest
            ${{ steps.vars.outputs.image_name }}:${{ github.sha }}

  update-gitops-manifest:
    needs: docker-build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Patch du tag d'image
        working-directory: infra/k8s/gitops/ml-service
        run: kustomize edit set image ${{ needs.docker-build-push.outputs.image_name }}=${{ needs.docker-build-push.outputs.image_name }}:${{ github.sha }}

      - name: Commit et push sur main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/gitops/ml-service/kustomization.yaml
          git commit -m "chore(gitops): update ml-service image to ${{ github.sha }} [skip ci]" || echo "Rien à committer"
          git push origin HEAD:main
