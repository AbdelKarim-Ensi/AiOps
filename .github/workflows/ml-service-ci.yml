name: ML Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/ml-service/**"
      - ".github/workflows/ml-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ml-service/**"

jobs:

  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-service

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ml-service/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérification syntaxique (compile check)
        run: python -m py_compile app/main.py app/loki_client.py app/backend_client.py app/predict.py app/features/loki_adapter.py app/features/feature_engineering.py

  docker-build-push:
    needs: lint-build
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Calculer le nom d'image en minuscules
        id: vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LOWER}/aiops-ml-service" >> "$GITHUB_OUTPUT"

      - name: Login à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: apps/ml-service
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:latest
            ${{ steps.vars.outputs.image_name }}:${{ github.sha }}

  deploy:
    needs: docker-build-push
    runs-on: self-hosted

    steps:
      - name: Redéployer sur le cluster kind
        run: |
          kubectl set image deployment/ml-service ml-service=${{ needs.docker-build-push.outputs.image_name }}:${{ github.sha }} -n aiops
          kubectl rollout status deployment/ml-service -n aiops --timeout=600s
