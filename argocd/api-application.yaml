apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AbdelKarim-Ensi/AiOps.git
    targetRevision: main
    path: infra/k8s/gitops/api
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
