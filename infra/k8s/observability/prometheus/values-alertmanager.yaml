# AJOUT : Phase 11 - Alertmanager + règle d'alerte sur le score d'anomalie
# Surcharge values-prometheus.yaml (à passer avec un second -f)

server:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s

alertmanager:
  enabled: true
  persistence:
    enabled: false
  config:
    route:
      receiver: slack-critical
      group_by: ["alertname"]
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 4h
    receivers:
      - name: slack-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack/webhook_url
            send_resolved: true
  extraSecretMounts:
    - name: slack-webhook
      mountPath: /etc/alertmanager/secrets/slack
      secretName: alertmanager-slack-webhook
      readOnly: true

serverFiles:
  alerting_rules.yml:
    groups:
      - name: aiops-anomaly
        rules:
          - alert: AnomalyScoreHigh
            expr: ml_anomaly_score_latest > 0.7
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Anomalie détectée par le ML service"
              description: "Score d'anomalie = {{ $value }} (seuil 0.7, dernière fenêtre fermée)"
